name: Build and Push to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout the code into a subdirectory named Expense_Tracker
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          path: Expense_Tracker

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repository name string
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 2. Build from the workspace root (.) so Docker sees the Expense_Tracker folder
      - name: Build and push the Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Expense_Tracker/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull fresh images and cycle application stack
        run: |
          cd ~/Desktop/project2/Expense_Tracker
          docker compose down
          docker compose pull
          docker compose up -d
